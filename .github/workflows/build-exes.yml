name: Build EXEs

# 打 tag（如 v1.0.0）时自动构建三个 exe 并附到 Release。
# 也可在 Actions 页面手动触发（workflow_dispatch）只做构建、上传 artifact。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # 兜底：冒烟/自检步骤会拉起 GUI 类进程，一旦拿不到桌面可能长时间不退出。
    # 没有这道闸，作业会一路挂到平台默认超时（6 小时）才知道出问题。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_exes.ps1 会自己建一次性 venv，并钉死 pymupdf 版本。
      # 这里只需把用于建 venv 的解释器指给它。
      #
      # 注意：pythonLocation 是 setup-python 注入的**真实环境变量**，不属于
      # env 上下文（那个上下文只含 workflow/job/step 用 env: 显式声明的键）。
      # 用 env 上下文去引用它会静默展开成空串，得到 "\python.exe" 这种假路径，
      # 把错误推到构建脚本深处。因此只能在脚本内部读 env:pythonLocation。
      - name: Build the three executables
        shell: pwsh
        run: |
          # pwsh 步骤默认 ErrorActionPreference=Continue：脚本报红字但退出码仍为 0，
          # 会把失败的构建伪装成 success，真实原因要等到下一步"收集产物"才暴露。
          $ErrorActionPreference = 'Stop'
          # pip / PyInstaller 是原生命令，非零退出同样默认不中止；一并管起来。
          $PSNativeCommandUseErrorActionPreference = $true

          if (-not $env:pythonLocation) {
            throw "setup-python 没有提供 pythonLocation 环境变量"
          }
          $env:DUAL_BUILD_PY = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path $env:DUAL_BUILD_PY)) {
            throw "构建用 Python 不存在: $env:DUAL_BUILD_PY"
          }
          "构建用 Python: $env:DUAL_BUILD_PY"
          & $env:DUAL_BUILD_PY --version

          # 关键：失败时把真实原因写进 **annotation**。Actions 的日志端点需要登录
          # （匿名 403），而 check-runs/annotations 是匿名可读的——没有这一步，
          # 外部只能看到"退出码 1"这种无信息量的结论，排查只能靠猜。
          #
          # 用 *> 把脚本的全部流重定向进文件，而不是 `2>&1 | Tee-Object`：后者会把
          # 原生命令的 stderr 变成管道里的 ErrorRecord，在 ErrorActionPreference=Stop
          # 下 PyInstaller 的普通告警也可能被当错误中断整个步骤。
          $buildLog = Join-Path $env:RUNNER_TEMP "build-exes.log"
          $wanted = @("同页对照工具.exe", "DualGuiCLI.exe", "DualEngine.exe")
          function Ann-Err([string]$m) {
            # annotation 消息里的换行必须转义，且长度会被 GitHub 截断
            $one = ($m -replace "`r", "" -replace "`n", "%0A")
            if ($one.Length -gt 900) { $one = $one.Substring(0, 900) }
            Write-Host "::error::$one"
          }

          try {
            ./build_exes.ps1 *> $buildLog
          } catch {
            Ann-Err "build_exes.ps1 抛出终止错误：$($_.Exception.Message)"
          }
          # 日志尾部照常打到 CI 输出，便于在网页里直接看
          if (Test-Path -LiteralPath $buildLog) {
            Get-Content -LiteralPath $buildLog | Select-Object -Last 200
          }

          # build_exes.ps1 内部用了 Set-Location，需回到仓库根目录
          Set-Location $env:GITHUB_WORKSPACE

          $missing = $wanted | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            $tail = ""
            if (Test-Path -LiteralPath $buildLog) {
              $tail = (Get-Content -LiteralPath $buildLog -Tail 40) -join "`n"
            }
            $dist = ""
            foreach ($d in @("$env:TEMP\dualbuild\gui\dist", "$env:TEMP\dualbuild\eng\dist")) {
              if (Test-Path -LiteralPath $d) {
                $dist += " [$d] " + ((Get-ChildItem -LiteralPath $d | ForEach-Object Name) -join ", ")
              }
            }
            Ann-Err ("根目录缺少 exe: " + ($missing -join ", ") +
                     " | PS=$($PSVersionTable.PSVersion) | pythonLocation=$env:pythonLocation" +
                     " | 根目录exe=" + ((Get-ChildItem -Path *.exe -EA SilentlyContinue | ForEach-Object Name) -join ",") +
                     " | dist残留=$dist | 构建日志尾部: $tail")
            exit 1
          }
          Get-ChildItem -Path *.exe | Select-Object Name, Length

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 全部用命名参数：Copy-Item / New-Item 只有两个位置槽（Path、Destination），
          # 写 `Copy-Item README.md LICENSE dist-out` 会绑成 Path=README.md、
          # Destination=LICENSE（把许可证覆盖掉！），剩下的 dist-out 无处安放并报
          # "A positional parameter cannot be found that accepts argument 'dist-out'"。
          New-Item -ItemType Directory -Path dist-out -Force | Out-Null
          $names = @("同页对照工具.exe", "DualGuiCLI.exe", "DualEngine.exe")
          foreach ($n in $names) {
            if (-not (Test-Path -LiteralPath $n)) { throw "缺少构建产物: $n" }
            Copy-Item -LiteralPath $n -Destination dist-out -Force
          }
          Copy-Item -LiteralPath README.md, LICENSE -Destination dist-out -Force
          Get-ChildItem -Path dist-out | Select-Object Name, Length

      # 启动器可运行性冒烟测试。
      # 注意入口选择：main() 的每个分支都要求 argv 非空（dual_gui.py:758-781），
      # 所以**不带参数调用不会返回 2**，而是掉到最后的 gui_main 起 tkinter 主循环，
      # 在 runner 上表现为长时间挂起。真正稳定的用法出口是 `--cli` 且不给源文件：
      # cli_main 打印用法并 return 2（dual_gui.py:480-483），全程不 import pymupdf。
      - name: Smoke test launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = ".\dist-out\DualGuiCLI.exe"
          # 用 Start-Process + WaitForExit(ms) 而不是 -Wait：万一 exe 起了主循环，
          # 也能在 120 秒强制收掉并判失败，而不是挂满作业超时。
          $p = Start-Process -FilePath $exe -ArgumentList '--cli' `
                -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force -EA SilentlyContinue
            throw "启动器 --cli 未在 120 秒内退出（可能误入 GUI 主循环）"
          }
          if ($p.ExitCode -ne 2) {
            throw "启动器冒烟测试失败，--cli 退出码 $($p.ExitCode)（期望 2 = 打印用法）"
          }
          Write-Host "启动器可正常运行（--cli 退出码 2 = 打印用法）"

      # 冻结构件自检：tkinter 可用 + 同级 DualEngine.exe 存在 + 引擎模块齐全。
      # gui_check() 会真开一次 Tk 窗口再销毁（dual_gui.py:710-735），因此它比上面的
      # 用法检查强得多；但它依赖能创建窗口，故失败时只通报不阻断——runner 若无交互
      # 桌面属于环境限制，不是构件缺陷。
      - name: Self-check frozen build (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = ".\dist-out\DualGuiCLI.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--check' `
                -NoNewWindow -PassThru `
                -RedirectStandardOutput check-out.txt `
                -RedirectStandardError  check-err.txt
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -EA SilentlyContinue
            Write-Host "::warning::--check 未在 180 秒内退出（runner 可能无交互桌面），跳过判定"
          } else {
            $out = ((Get-Content check-out.txt -Raw -EA SilentlyContinue) +
                    (Get-Content check-err.txt  -Raw -EA SilentlyContinue)) -replace "`r|`n", " "
            if ($p.ExitCode -ne 0) {
              $one = if ($out.Length -gt 700) { $out.Substring(0,700) } else { $out }
              Write-Host "::warning::--check 退出码 $($p.ExitCode)：$one"
            } else {
              Write-Host "--check 通过：tkinter 与引擎自检均正常"
            }
          }

      # 架构铁律验证：启动器包里绝不能含 PyMuPDF。
      # 两个启动器都要查（GUI 版同样必须干净），并且必须确认真的读到了内容——
      # 读到空字节会让正则永不命中，把"打包被污染"误报成通过。
      - name: Verify launchers exclude PyMuPDF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($exe in @("DualGuiCLI.exe", "同页对照工具.exe")) {
            $path = ".\dist-out\$exe"
            if (-not (Test-Path -LiteralPath $path)) { throw "缺少 $path" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path))
            if ($bytes.Length -lt 1MB) {
              throw "$exe 只有 $($bytes.Length) 字节，明显不是完整包，扫描结论不可信"
            }
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text -match "mupdfcpp64|_mupdf\.pyd") {
              throw "$exe 包含 PyMuPDF 二进制 —— 违反架构铁律，会破坏 pdf2zh 子进程"
            }
            Write-Host "$exe 未包含 PyMuPDF（扫描 $($bytes.Length) 字节，符合架构铁律）"
          }

      - name: Upload artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: dual-pdf-tool-exes
          path: dist-out/

      - name: Attach to Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-out/*
          body: |
            同页对照 PDF 工具 —— 免安装版本。

            | 文件 | 说明 |
            |---|---|
            | `同页对照工具.exe` | 图形界面，双击即用 |
            | `DualGuiCLI.exe` | 命令行版（脚本/回归调用） |
            | `DualEngine.exe` | 合成引擎，由上面两个自动调起，**勿单独使用** |

            三个文件需放在**同一目录**下。在线翻译功能需要联网。

            本版本以 AGPL-3.0 发布，详见仓库中的 LICENSE、DEPENDENCIES.md 与
            THIRD-PARTY-NOTICES.md。
